[project]
name = "neweds"
version = "0.1.0"
description = "Research-oriented toolkit for multivariate time-series connectivity analysis."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "kudrl" },
]
keywords = ["time-series", "connectivity", "scientific-python", "neuroscience"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "matplotlib>=3.5",
    "networkx>=3.0",
    "openpyxl>=3.1",
    "Pillow>=10.4",
    "tqdm>=4.66",
    "h5py>=3.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=4.1",
    "ruff>=0.6",
]
advanced = [
    "dcor>=0.6",
    "hurst>=0.0.5",
    "nolds>=0.5.2",
]
io = [
    "pyarrow>=15",
    "xlrd>=2.0.1",
]

[project.scripts]
neweds = "neweds.cli:main"
neweds-group = "neweds.cli_group:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["neweds*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line length governed by formatter
    "B008",   # function-call default args are common in CLIs
    "SIM108", # ternary collapse hurts readability for matrix code
    "SIM105", # contextlib.suppress is slower than try/except/pass in tight loops
    "SIM102", # nested-if collapse can hide branch intent
    "B905",   # zip strict=False is the correct default for numerical code
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117", "SIM115"]
"neweds/__init__.py" = ["E402"]
# F822: lazy module-level __getattr__ exposes names that are not defined in module scope.
"neweds/config.py" = ["E402", "F822"]
"neweds/methods.py" = ["F822"]
"neweds/core/data_loader.py" = ["E402", "I001", "UP028"]
"neweds/core/fft_analysis.py" = ["E402"]
"neweds/core/variant_presets.py" = ["E402"]
"neweds/core/voxel_space.py" = ["SIM103", "UP042"]
"neweds/io/user_input.py" = ["E402"]
"neweds/metrics/connectivity.py" = ["E402", "F401", "UP028", "UP042"]
"neweds/validation/__init__.py" = ["F401"]
