[project]
name = "neweds"
version = "0.1.0"
description = "Multivariate time-series and fMRI connectivity analysis toolkit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "matplotlib>=3.5",
    "networkx>=3.0",
    "openpyxl>=3.1",
    "Pillow>=10.4",
    "tqdm>=4.66",
    "hurst>=0.0.5",
    "nolds>=0.5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

app = [
    "streamlit>=1.37",
]

[project.scripts]
neweds = "interfaces.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*", "interfaces", "interfaces.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
